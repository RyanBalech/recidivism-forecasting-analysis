name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.3,<3" \
            "numpy>=2.3,<3" \
            "scikit-learn==1.7.2" \
            "xgboost>=3.0,<4" \
            "joblib>=1.5,<2" \
            "scipy>=1.13,<2" \
            "pytest>=8,<9"

      - name: Run lightweight validation suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_core.py \
            -k "not single_row_scores_like_a_batch and not published_predictions_match_saved_models and not shap_reconstructs_saved_model_probabilities and not xgboost_pipeline_scores_raw_rows"
